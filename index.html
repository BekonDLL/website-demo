<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YKK - Alimentation Animale</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #E57026;
      color: #333;
      text-align: center;
      padding: 40px;
      margin: 0;
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      margin: 0 auto;
      padding: 30px;
      z-index: 1;
      position: relative;
    }

    .logo {
      width: 200%;      /* scales with container */
  max-width: 200px; /* won’t get too big */
  height: auto;     /* keep aspect ratio */
  margin-bottom: 20px;

}

    p {
      color: #555;
      margin-bottom: 25px;
    }

    .btn {
      display: block;
      background: #007bff;
      color: #ffffff;
      text-decoration: none;
      padding: 14px;
      border-radius: 10px;
      margin: 10px auto;
      width: 80%;
      font-size: 16px;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #0056b3;
    }

    .btn-secondary {
      background: #28a745;
    }

    .btn-secondary:hover {
      background: #1c7c32;
    }

    .bottom-right-img {
  position: absolute;   /* or fixed if you want it to stay on screen */
  bottom: 0;            /* stick to bottom */
  right: 0;             /* stick to right */
  width: 500px;         /* adjust size */
  max-width: 50;       /* scales with screen */
  height: auto;
  z-index: 0;           /* behind your main content */
  pointer-events: none; /* clicks pass through */
}
  </style>
</head>
<body>
  <div class="container">
    <img src="ahli logo.png" alt="Logo YKK" class="logo">
    <p><strong>Bienvenue chez Ahli Commo & feed</strong> votre partenaire de confiance en alimentation animale pour bovins, ovins et volailles.</p>

    <a href="tel:+212666406000" class="btn">📞 Contactez-nous</a>
    <a href="https://maps.app.goo.gl/CZPxbDNnejvSRGoA8" class="btn btn-secondary">📍 Nous localiser</a>
  </div>

  <!-- Bottom-right image -->
  <img src="Untitled-1.svg" alt="Texture" class="bottom-right-img">
</body>
</html>
